name: cachecpu
on:
  push:
    branches: [bs/cachecpu-1]
jobs:
  prof:
    runs-on: vulcan-4vcpu-ubuntu-2404
    steps:
      - name: generate
        run: |
          mkdir -p synth; for i in $(seq 1 400); do if [ $((i%2)) = 0 ]; then head -c 4194304 /dev/urandom > synth/r$i.bin; else head -c 3145728 /dev/urandom | base64 -w 120 > synth/t$i.txt; fi; done
          ethtool -i eth0 2>/dev/null | head -2 || true; cat /sys/class/net/eth0/mtu
          (for i in $(seq 1 200); do echo "T $(date +%s.%N) $(head -1 /proc/stat) EDGE $(awk '{print $14+$15}' /proc/$(pgrep -x edge | head -1)/stat 2>/dev/null)"; sleep 0.25; done) > /tmp/samples.txt &
      - name: save 1
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: synth
          key: cpu-${{ github.run_id }}-${{ github.run_attempt }}-1
      - name: restore 1
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: synth
          key: cpu-${{ github.run_id }}-${{ github.run_attempt }}-1
      - name: samples
        run: |
          sleep 2; awk '{t=$2; tot=0; for(i=4;i<=13;i++) tot+=$i; idle=$7+$8; e=$NF; if (pt) printf "%s busy=%.0f%% (of 4 vCPU) edge=%.0f%%\n", t, 100*(1-(idle-pidle)/(tot-ptot)), (e-pe)/(t-pt); pt=t; ptot=tot; pidle=idle; pe=e}' /tmp/samples.txt | awk '{print}' > /tmp/s2.txt; cat /tmp/s2.txt | head -120
