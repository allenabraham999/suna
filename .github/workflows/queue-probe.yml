name: Queue probe
on:
  push:
    branches: [bs/queue-1]
    paths: ['.github/workflows/queue-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      matrix:
        i: [1]
    runs-on: vulcan-4vcpu-ubuntu-2404
    steps:
      - name: timeline
        run: |
          sudo python3 - <<'PY'
          import os,time,glob,re
          now=time.time(); up=float(open('/proc/uptime').read().split()[0]); boot=now-up; hz=os.sysconf('SC_CLK_TCK')
          def iso(t): return time.strftime('%H:%M:%S',time.gmtime(t))+('%.3f'%(t%1))[1:]
          print('NOW ',iso(now)); print('BOOT',iso(boot))
          rows=[]
          for p in os.listdir('/proc'):
            if not p.isdigit(): continue
            try:
              st=open(f'/proc/{p}/stat').read(); cmd=open(f'/proc/{p}/cmdline').read().replace('\0',' ')[:90]
            except Exception: continue
            start=int(st.rsplit(')',1)[1].split()[19])/hz
            if re.search(r'run-job|dockerd|containerd |Runner\.|run\.sh|edge|curl|sudo|sleep|envd|agent|systemd ',cmd): rows.append((start,p,cmd))
          for s,p,c in sorted(rows): print('PROC',iso(boot+s),'+%.2f'%s,p,re.sub(r'jitconfig \S+','jitconfig <x>',c))
          PY
          echo "--- dockerd.log"; sudo grep -E "Starting up|API listen|Daemon has completed" /var/log/dockerd.log | cut -c1-140
          echo "--- vulcan logs"; for f in /var/log/vulcan-*.log; do echo "## $f"; sudo head -5 $f | cut -c1-200; done
          echo "--- runner diag"
          d=/home/runner/actions-runner/_diag
          grep -hE "Session created|Acknowledging|received" $d/Runner_*.log | cut -c1-160 | head
      - name: network timings
        run: |
          cat /etc/resolv.conf | grep -v "^#"
          for h in broker.actions.githubusercontent.com api.github.com pipelinesghubeus22.actions.githubusercontent.com run-actions-1-azure-eastus.actions.githubusercontent.com results-receiver.actions.githubusercontent.com; do
            for i in 1 2; do curl -s -o /dev/null -w "$h dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} ip=%{remote_ip}\n" https://$h/ ; done
          done
          getent hosts broker.actions.githubusercontent.com
          ip route | head -3
