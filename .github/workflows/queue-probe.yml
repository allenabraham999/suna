name: Queue probe
on:
  push:
    branches: [bs/queue-1]
    paths: ['.github/workflows/queue-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      matrix:
        i: [1]
    runs-on: vulcan-4vcpu-ubuntu-2404
    steps:
      - name: timeline
        run: |
          now=$(date +%s.%N)
          up=$(cut -d' ' -f1 /proc/uptime)
          echo "NOW $(date -u +%FT%T.%3NZ)"
          echo "BOOT $(date -u -d @$(echo "$now - $up" | bc) +%FT%T.%3NZ)"
          echo "--- processes"
          ps -eo pid,lstart,etimes,args --sort=start_time | grep -E "run-job|dockerd|containerd|Runner.Listener|Runner.Worker|vulcan-edge|run.sh|systemd$|pt-agent|envd" | grep -v grep | cut -c1-200
          echo "--- elapsed-ms per proc"
          for p in $(pgrep -f "run-job.sh|dockerd|Runner.Listener|Runner.Worker"); do
            st=$(awk '{print $22}' /proc/$p/stat); echo "$p $(echo "scale=3; $st/$(getconf CLK_TCK)" | bc)s-after-boot $(tr '\0' ' ' </proc/$p/cmdline | cut -c1-80)"; done
          echo "--- dockerd.log head"
          sudo head -3 /var/log/dockerd.log 2>/dev/null | cut -c1-200; sudo grep -m1 "API listen" /var/log/dockerd.log | cut -c1-200
          echo "--- runner diag"
          d=/home/runner/actions-runner/_diag
          ls -la $d
          grep -hE "Runner.Listener|Starting|session|Session|GetNextMessage|Message|Job request|JobDispatcher|Running job|broker|Connect|connected|Listening" $d/Runner_*.log | cut -c1-220 | head -60
          echo "--- worker diag head"
          head -5 $d/Worker_*.log | cut -c1-200
          grep -hE "Job ID|Start|Setup" $d/Worker_*.log | head -10 | cut -c1-200
          echo "--- run-job stderr / journal"
          sudo journalctl --no-pager -b 2>/dev/null | head -0
          systemd-analyze 2>/dev/null || true
