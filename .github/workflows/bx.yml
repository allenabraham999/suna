name: BX
# Bench copy of ci.yml's self-host-schema job (steps verbatim). The optional
# first step stands in for a runner-image change: it pins dockerd's image store.
on:
  push:
    branches: ['bs/buildx-*']
    paths: ['.bx-tick']
permissions:
  contents: read
jobs:
  self-host-schema:
    name: Self-host schema bootstrap
    runs-on: ${{ vars.CI_RUNNER_M || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - name: stand-in image store
        if: ${{ !endsWith(github.ref_name, '-none') }}
        env:
          STORE: ${{ contains(github.ref_name, '-cd') && 'containerd' || 'classic' }}
        run: |
          df -h /mnt/vulcan-sticky 2>/dev/null || true
          sudo ls /mnt/vulcan-sticky/docker 2>/dev/null || true
          docker info --format 'before: driver={{.Driver}} images={{.Images}}'
          v=false; [ "$STORE" = containerd ] && v=true
          f=/etc/docker/daemon.json
          (sudo cat $f 2>/dev/null || echo '{}') | jq --argjson v $v '.features["containerd-snapshotter"]=$v' > /tmp/daemon.json
          sudo cp /tmp/daemon.json $f
          pid=$(pidof dockerd); args=$(tr '\0' ' ' < /proc/$pid/cmdline)
          t0=$(date +%s.%N)
          sudo kill $pid; for _ in $(seq 100); do sudo kill -0 $pid 2>/dev/null || break; sleep 0.1; done
          sudo sh -c "nohup $args >>/var/log/dockerd.log 2>&1 &"
          for _ in $(seq 120); do docker info >/dev/null 2>&1 && break; sleep 0.5; done
          echo "restart $(echo "$(date +%s.%N) - $t0" | bc)s"
          docker info --format 'after: driver={{.Driver}} images={{.Images}}'
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install pnpm
        run: |
          corepack enable pnpm
          echo "pnpm: $(pnpm -v)  node: $(node -v)  bun: $(bun -v)"

      - name: Install dependencies (CLI + workspace deps)
        run: pnpm install --frozen-lockfile --filter "@kortix/cli..."
        env:
          npm_config_engine_strict: "false"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build API image
        # --load: the buildx builder is a separate buildkitd, so the result
        # must be exported into the local daemon for the compose stack below.
        # The dev image's registry cache warms it (read-only).
        run: docker build --load --cache-from type=registry,ref=kortix/kortix-api:dev-buildcache --build-arg SERVICE=apps/api -f apps/api/Dockerfile -t kortix/kortix-api:selfhost-local .

      - name: Self-host schema-bootstrap check (fresh DB)
        run: bash apps/cli/scripts/self-host-e2e/schema-check.sh
        env:
          API_IMAGE: kortix/kortix-api:selfhost-local

      - name: extra store A/B
        if: ${{ endsWith(github.ref_name, 'x') }}
        run: |
          set -u
          B="docker build --load --cache-from type=registry,ref=kortix/kortix-api:dev-buildcache --build-arg SERVICE=apps/api -f apps/api/Dockerfile"
          BX="docker buildx build --load --cache-from type=registry,ref=kortix/kortix-api:dev-buildcache --build-arg SERVICE=apps/api -f apps/api/Dockerfile"
          orig=$(tr '\0' ' ' < /proc/$(pidof dockerd)/cmdline)
          cp /etc/docker/daemon.json /tmp/daemon.orig.json
          restart() { # $1 data root, $2 containerd-snapshotter true|false
            local pid; pid=$(pidof dockerd)
            jq --argjson v $2 '.features["containerd-snapshotter"]=$v' /tmp/daemon.orig.json > /tmp/d.json; sudo cp /tmp/d.json /etc/docker/daemon.json
            sudo kill $pid; for _ in $(seq 200); do sudo kill -0 $pid 2>/dev/null || break; sleep 0.1; done
            sudo sh -c "nohup dockerd --data-root $1 >>/var/log/dockerd.log 2>&1 &"
            for _ in $(seq 120); do docker info >/dev/null 2>&1 && break; sleep 0.5; done
            docker info --format "dockerd up: root={{.DockerRootDir}} driver={{.Driver}}"
          }
          t() { local t0=$(date +%s.%N); "$@" > /tmp/out.log 2>&1; local rc=$?; printf '%-28s %6.1fs rc=%s\n' "$LABEL" "$(echo "$(date +%s.%N) - $t0" | bc)" $rc; grep -E '(unpacking|sending tarball|importing to docker|exporting layers|writing image).* done|^#[0-9]+ DONE' /tmp/out.log | grep -E 'unpacking|tarball|exporting layers|writing image' | sed 's/^/    /'; }
          for store in false true; do
            root=/mnt/vulcan-sticky/bx-$store; sudo rm -rf $root
            echo "=== containerd-snapshotter=$store"
            restart $root $store
            LABEL="docker build cold" t $B -t bx/api:a .
            restart $root $store
            LABEL="docker build warm" t $B -t bx/api:a .
            LABEL="docker build warm newtag" t $B -t bx/api:b .
            docker buildx create --name bxc --driver docker-container --buildkitd-config $HOME/.docker/buildx/buildkitd.default.toml >/dev/null
            LABEL="bootstrap fresh builder" t docker buildx inspect --bootstrap bxc
            LABEL="container cold state" t $BX --builder bxc -t bx/api:c .
            docker rm -f buildx_buildkit_bxc0 >/dev/null; docker buildx rm --keep-state bxc >/dev/null 2>&1 || true
            restart $root $store
            docker buildx create --name bxc --driver docker-container --buildkitd-config $HOME/.docker/buildx/buildkitd.default.toml >/dev/null
            LABEL="bootstrap kept-state builder" t docker buildx inspect --bootstrap bxc
            LABEL="container kept state" t $BX --builder bxc -t bx/api:d .
            LABEL="container kept, no load" t docker buildx build --builder bxc --cache-from type=registry,ref=kortix/kortix-api:dev-buildcache --build-arg SERVICE=apps/api -f apps/api/Dockerfile .
            sudo du -sh $root 2>/dev/null | tail -1
            docker buildx rm bxc >/dev/null 2>&1 || true
          done
          restart /mnt/vulcan-sticky/docker false >/dev/null
          sudo cp /tmp/daemon.orig.json /etc/docker/daemon.json
          pid=$(pidof dockerd); sudo kill $pid; for _ in $(seq 200); do sudo kill -0 $pid 2>/dev/null || break; sleep 0.1; done
          sudo sh -c "nohup $orig >>/var/log/dockerd.log 2>&1 &"; for _ in $(seq 120); do docker info >/dev/null 2>&1 && break; sleep 0.5; done
          sudo rm -rf /mnt/vulcan-sticky/bx-false /mnt/vulcan-sticky/bx-true
          docker info --format "restored: root={{.DockerRootDir}} driver={{.Driver}}"; df -h /mnt/vulcan-sticky
