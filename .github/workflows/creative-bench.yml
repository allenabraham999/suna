name: Creative bench
on:
  push:
    branches: [bs/creative-1]
    paths: ['.github/workflows/creative-bench.yml']
permissions:
  contents: read
jobs:
  eslint:
    runs-on: vulcan-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: probe
        run: |
          nproc; grep -m1 "model name" /proc/cpuinfo; free -m | head -2
          cat /sys/kernel/mm/transparent_hugepage/enabled /sys/kernel/mm/transparent_hugepage/defrag || true
          grep -m1 "Git warm cache" -r /home/runner/actions-runner/_diag 2>/dev/null | head -1 || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: pnpm
        run: corepack enable pnpm && pnpm -v && node -v
      - name: install
        run: pnpm install --frozen-lockfile --filter "./apps/web..."
        env:
          npm_config_engine_strict: "false"
      - name: eslint variants
        run: |
          cd apps/web
          THP=/sys/kernel/mm/transparent_hugepage/enabled
          THP0=$(sed -n 's/.*\[\(.*\)\].*/\1/p' $THP)
          export NCC=$RUNNER_TEMP/ncc
          thp() { echo "$1" | sudo tee $THP >/dev/null; }
          run() { # name, thp mode, env assignments...
            local name=$1 mode=$2; shift 2
            thp "$mode"
            local s=$EPOCHREALTIME
            env "$@" pnpm exec eslint src --quiet >/dev/null 2>&1 || true
            local e=$EPOCHREALTIME
            thp "$THP0"
            awk -v n="$name" -v s="$s" -v e="$e" 'BEGIN{printf "RESULT %-10s %6.2f\n", n, e-s}'
          }
          run nccprime "$THP0" NODE_COMPILE_CACHE=$NCC
          for round in 1 2 3; do
            run plain "$THP0" X=1
            run thp always X=1
            run semi64 "$THP0" NODE_OPTIONS=--max-semi-space-size=64
            run ncc "$THP0" NODE_COMPILE_CACHE=$NCC
            run thpsemi always NODE_OPTIONS=--max-semi-space-size=64
            run all always NODE_COMPILE_CACHE=$NCC NODE_OPTIONS=--max-semi-space-size=64
          done
          grep -E "AnonHugePages" /proc/meminfo
      - name: eslint cache probe (info)
        run: |
          cd apps/web
          t() { local s=$EPOCHREALTIME; "$@" >/dev/null 2>&1; local e=$EPOCHREALTIME; awk -v n="$N" -v s="$s" -v e="$e" 'BEGIN{printf "RESULT %-10s %6.2f\n", n, e-s}'; }
          N=cachecold t pnpm exec eslint src --quiet --cache --cache-location /tmp/elc --cache-strategy content
          f=$(git ls-files src | grep -E "\.tsx$" | head -1); echo "// touch" >> "$f"
          N=cachewarm t pnpm exec eslint src --quiet --cache --cache-location /tmp/elc --cache-strategy content
          N=concauto t pnpm exec eslint src --quiet --concurrency=auto
          N=conc-thp t bash -c 'echo always | sudo tee /sys/kernel/mm/transparent_hugepage/enabled >/dev/null; pnpm exec eslint src --quiet --concurrency=auto'
          git checkout -- "$f"
