name: Creative bench
on:
  push:
    branches: [bs/creative-1]
    paths: ['.github/workflows/creative-bench.yml']
permissions:
  contents: read
jobs:
  eslint:
    runs-on: vulcan-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: probe
        run: |
          nproc; grep -m1 "model name" /proc/cpuinfo; free -m | head -2
          cat /sys/kernel/mm/transparent_hugepage/enabled /sys/kernel/mm/transparent_hugepage/defrag || true
          grep -m1 "Git warm cache" -r /home/runner/actions-runner/_diag 2>/dev/null | head -1 || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: pnpm
        run: corepack enable pnpm && pnpm -v && node -v
      - name: install
        run: pnpm install --frozen-lockfile --filter "./apps/web..."
        env:
          npm_config_engine_strict: "false"
      - name: preload (stand-in for the image)
        run: |
          mkdir -p $RUNNER_TEMP/eslc
          cat > $RUNNER_TEMP/eslint-cache.cjs <<'PRE'
          'use strict';
          // Preload (NODE_OPTIONS=--require): ESLint runs with its result cache on,
          // in VULCAN_ESLINT_CACHE_DIR, unless the caller already chose a cache.
          // ESLint keys each entry on the file's content and the config that applies
          // to it, so a hit returns exactly what a fresh lint would.
          const dir = process.env.VULCAN_ESLINT_CACHE_DIR;
          if (dir) {
            const Module = require('node:module');
            const path = require('node:path');
            const target = /[\\/]eslint[\\/]lib[\\/]eslint[\\/]eslint\.js$/;
            const load = Module._load;
            const done = new WeakSet();
            Module._load = function (request, parent, isMain) {
              const exp = load.apply(this, arguments);
              try {
                if (exp && typeof exp.ESLint === 'function' && !done.has(exp)) {
                  const file = Module._resolveFilename(request, parent, isMain);
                  if (target.test(file)) {
                    done.add(exp);
                    const Base = exp.ESLint;
                    exp.ESLint = class ESLint extends Base {
                      constructor(options = {}) {
                        if (!options.cache) {
                          options = { ...options, cache: true, cacheStrategy: 'content', cacheLocation: dir.replace(/[\\/]*$/, path.sep) };
                        }
                        super(options);
                      }
                    };
                  }
                }
              } catch { /* never in the way */ }
              return exp;
            };
          }
          PRE
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/eslc
          key: eslc-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: eslc-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: eslint plain vs cached (same unmodified command)
        run: |
          ls -la $RUNNER_TEMP/eslc
          T() { local s=$EPOCHREALTIME; "$@"; local rc=$?; local e=$EPOCHREALTIME; awk -v n="$N" -v s="$s" -v e="$e" -v rc=$rc 'BEGIN{printf "RESULT %-12s %6.2f rc=%d\n", n, e-s, rc}'; }
          C=(env VULCAN_ESLINT_CACHE_DIR=$RUNNER_TEMP/eslc NODE_OPTIONS="--require $RUNNER_TEMP/eslint-cache.cjs")
          N=plain T bash -c 'pnpm --dir apps/web exec eslint src --quiet > /tmp/o-plain 2>&1'
          N=cached T "${C[@]}" bash -c 'pnpm --dir apps/web exec eslint src --quiet > /tmp/o-cached 2>&1'
          N=cached2 T "${C[@]}" bash -c 'pnpm --dir apps/web exec eslint src --quiet > /tmp/o-cached2 2>&1'
          for f in $(git ls-files apps/web/src | grep -E "\.tsx$" | shuf -n 10 --random-source=<(yes)); do echo "// pr edit" >> $f; done
          N=cached10chg T "${C[@]}" bash -c 'pnpm --dir apps/web exec eslint src --quiet > /tmp/o-cached3 2>&1'
          N=plain10chg T bash -c 'pnpm --dir apps/web exec eslint src --quiet > /tmp/o-plain3 2>&1'
          N=nonquiet-c T "${C[@]}" bash -c 'pnpm --dir apps/web exec eslint src > /tmp/o-nq-c 2>&1'
          N=nonquiet-p T bash -c 'pnpm --dir apps/web exec eslint src > /tmp/o-nq-p 2>&1'
          git checkout -- apps/web/src
          for p in "plain cached" "plain cached2" "plain3 cached3" "nq-p nq-c"; do set -- $p; cmp -s /tmp/o-$1 /tmp/o-$2 && echo "SAME $1 $2" || { echo "DIFF $1 $2"; diff /tmp/o-$1 /tmp/o-$2 | head -5; }; done
          tail -3 /tmp/o-nq-p
          ls -la $RUNNER_TEMP/eslc
