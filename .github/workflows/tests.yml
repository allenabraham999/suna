# bench: serialized copy (one job at a time)
name: Tests
'on':
  workflow_call: null
  pull_request:
    branches:
    - dev
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review
    - labeled
  schedule:
  - cron: 41 5 * * *
  workflow_dispatch: null
concurrency:
  group: tests-${{ github.ref }}${{ github.event.action == 'labeled' && '-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  lane:
    name: ${{ matrix.lane }} lane
    if: github.event_name != 'pull_request' || github.base_ref == 'prod' || (github.event.action == 'labeled' && github.event.label.name == 'test')
    runs-on: ${{ vars.CI_RUNNER_L || 'ubuntu-24.04' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
        - lane: core-flows
          mode: core
          args: --core-group=flows
        - lane: core-db
          mode: core
          args: --core-group=db
        - lane: packages-api
          mode: packages
          args: --packages-only --package-group=api
        - lane: packages-cli
          mode: packages
          args: --packages-only --package-group=cli
        - lane: packages-kortixd
          mode: packages
          args: --packages-only --package-group=kortixd
        - lane: packages-rest
          mode: packages
          args: --packages-only --package-group=rest
      max-parallel: 1
    env:
      CI: '1'
      TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TEST_LANE: ${{ matrix.lane }}
      TEST_ARGS: ${{ matrix.args }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.TEST_SHA }}
        fetch-depth: 1
    - uses: actions/setup-node@v7
      with:
        node-version: 22
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.3
    - name: Install workspace dependencies
      run: 'corepack enable pnpm

        echo "pnpm: $(pnpm -v)  node: $(node -v)  bun: $(bun -v)  docker: $(docker -v)"

        pnpm install --frozen-lockfile

        '
      env:
        npm_config_engine_strict: 'false'
    - name: Install ripgrep
      if: matrix.mode == 'packages'
      run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ripgrep
    - name: Restore Chromium
      if: matrix.lane == 'packages-rest'
      uses: actions/cache@v4
      with:
        path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
        key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Install Chromium
      if: matrix.lane == 'packages-rest'
      run: pnpm --dir tests exec playwright install --with-deps chromium
    - name: Free the local Supabase ports
      run: "set -uo pipefail\npnpm exec supabase stop --no-backup || true\nfor port in 54321 54322 54323 54324; do\n  ids=$(docker ps -aq --filter \"publish=$port\" || true)\n  if [ -n \"$ids\" ]; then\n    echo \"[ci] removing stale container(s) on port $port: $ids\"\n    docker rm -f $ids || true\n  fi\ndone\n# Wait by ATTEMPTING A BIND, not by reading `ss`.\n#\n# `ss -ltn` lists LISTENING sockets only, so it reports a port free\n# while `bind()` still returns EADDRINUSE — a closing docker-proxy is\n# not \"listening\". Measured on browser-2: `supabase stop` returned at\n# 09:19:26.710, the old `ss` loop cleared all four ports by\n# 09:19:27.448 (0.74s, first poll), and `supabase start` still failed\n# to bind 54324 twenty-five seconds later. The check was passing on a\n# port that was not free, and two earlier fixes rested on that.\n#\n# A bind cannot disagree with Docker, because it is what Docker does.\n# An uncaught OSError exits 1, so no try/except is needed — which\n# keeps this a ONE-LINER. Multi-line python here would sit at column 0\n# inside this block scalar and break the YAML.\n# SO_REUSEADDR matches docker-proxy: without it a lingering TIME_WAIT\n# would make this wait the full 30s on a healthy runner.\nbindable() { python3 -c \"import socket,sys; s=socket.socket(); s.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1); s.bind(('0.0.0.0',int(sys.argv[1])))\" \"$1\" 2>/dev/null; }\nfor port in 54321 54322 54323 54324; do\n  for _ in $(seq 1 30); do\n    bindable \"$port\" && break\n    sleep 1\n  done\n  if ! bindable \"$port\"; then\n    echo \"::warning::port $port still refuses a bind after the sweep; supabase start will fail\"\n    ss -ltnp \"sport = :$port\" || true\n    ss -tanH \"sport = :$port\" || true\n    docker ps -a --filter \"publish=$port\" --format '{{.ID}} {{.Image}} {{.Status}} {{.Ports}}' || true\n  fi\ndone\n"
    - name: Run the root test lane
      run: "set -euo pipefail\n# SDK tests run in the core-db lane; skipping them here keeps the\n# binding `packages-*` lanes as short as they can be.\nif [[ \"$TEST_LANE\" == packages-* ]]; then\n  export KORTIX_PACKAGE_SKIP_SDK_TESTS=1\nfi\necho \"[ci] lane=$TEST_LANE sha=$TEST_SHA command=pnpm test -- $TEST_ARGS\"\n# shellcheck disable=SC2086 # TEST_ARGS is a matrix literal, split on purpose\nif [[ -n \"$TEST_ARGS\" ]]; then pnpm test -- $TEST_ARGS; else pnpm test; fi\n"
    - name: Stop the local Supabase stack
      if: always()
      run: pnpm exec supabase stop --no-backup || true
    - name: Guard test artifacts against secrets
      if: always()
      run: "set -euo pipefail\n# grep, never rg: GitHub's ubuntu images ship no ripgrep, and with the\n# tool missing under `2>/dev/null` this guard passed on nothing from\n# its first run until 2026-08-25, when Blacksmith images (which ship\n# rg) ran it for real. Pattern = GUARD_PATTERN_SOURCE in\n# tests/src/core/scrub.ts; the runner scrubs the same shapes before\n# writing results.json / report.html.\npattern='kortix_(pat|sa)_[A-Za-z0-9]{12,}|sk-[A-Za-z0-9]{20,}|eyJ[A-Za-z0-9_-]{30,}\\.'\nif [ -d tests/test-results ] && grep -rEIl \"$pattern\" tests/test-results; then\n  echo \"::error::A test artifact contains a secret-shaped value.\"\n  exit 1\nfi\necho \"No secret-shaped values found.\"\n"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: tests-results-${{ matrix.lane }}
        path: 'tests/test-results/**

          !tests/test-results/deployment-bypass-state.json

          '
        if-no-files-found: warn
        retention-days: 14
  trunk-report:
    name: trunk verdict
    needs:
    - lane
    if: ${{ !cancelled() && (github.event_name == 'schedule' && !cancelled() && needs.lane.result != 'success') }}
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
    - name: Report the trunk verdict
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        SHA: ${{ github.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: "set -euo pipefail\n\nlanes_of() {\n  gh api \"repos/$REPO/actions/runs/$1/jobs\" --paginate \\\n    --jq '.jobs[] | select(.conclusion != \"success\" and .conclusion != \"skipped\" and .conclusion != null) | select(.name | endswith(\"lane\")) | .name' \\\n    | sort | paste -sd, - | sed 's/,/, /g'\n}\n# `|| true`: a failed lookup must not swallow the comment below.\nfailed=\"$(lanes_of \"$RUN_ID\" || true)\"\n\n# A red `dev` would comment every night until it is fixed. Comment\n# only when the failing lanes change.\nprevious=\"$(gh api \"repos/$REPO/actions/workflows/tests.yml/runs?branch=dev&status=completed&per_page=10\" \\\n  --jq \"[.workflow_runs[] | select(.id != $RUN_ID) | select(.event == \\\"schedule\\\") | select(.conclusion == \\\"success\\\" or .conclusion == \\\"failure\\\")][0] | \\\"\\\\(.id) \\\\(.conclusion)\\\"\" || true)\"\nprev_failed=\"\"\nif [ \"${previous#* }\" = \"failure\" ]; then\n  prev_failed=\"$(lanes_of \"${previous%% *}\" || true)\"\nfi\n\n# Name every commit since the last green run on `dev`: those are the\n# suspects.\ngreen=\"$(gh api \"repos/$REPO/actions/workflows/tests.yml/runs?branch=dev&status=success&per_page=10\" \\\n  --jq '[.workflow_runs[] | select(.event == \"schedule\")][0].head_sha // empty' || true)\"\nsuspects=\"\"\nif [ -n \"$green\" ]; then\n  suspects=\"$(gh api \"repos/$REPO/compare/${green}...${SHA}\" \\\n    --jq '.commits[] | \"- `\\(.sha[0:10])` \\(.commit.message | split(\"\\n\")[0]) (@\\(.author.login // .commit.author.name))\"' || true)\"\nfi\n\n{\n  echo \"## \\`dev\\` @ \\`${SHA:0:8}\\`: failure\"\n  echo\n  echo \"Contract lanes (\\`core-flows\\`, \\`core-db\\`, \\`packages-*\\`).\"\n  if [ -n \"$failed\" ]; then\n    echo\n    echo \"Failing lanes: \\`$failed\\`\"\n  fi\n} >> \"$GITHUB_STEP_SUMMARY\"\n\nif [ -n \"$failed\" ] && [ \"$failed\" = \"$prev_failed\" ]; then\n  echo \"Same failing lanes as the previous run on dev; no new comment.\" | tee -a \"$GITHUB_STEP_SUMMARY\"\n  echo \"::error::dev is still red at $SHA (lanes: $failed)\"\n  exit 1\nfi\n\n# Built line by line: every line of this script must stay indented\n# inside the YAML block scalar, so no embedded multi-line literal.\n{\n  echo \"\\`dev\\` is red at this commit.\"\n  echo\n  echo \"Failing lanes: \\`${failed:-see the run}\\`\"\n  echo\n  echo \"Run: $RUN_URL\"\n  echo\n  if [ -n \"$suspects\" ]; then\n    echo \"Commits since the last green run (\\`${green:0:10}\\`), newest last:\"\n    echo\n    echo \"$suspects\"\n    echo\n  fi\n  echo \"The author whose commit broke it fixes forward. If \\`dev\\` is still\"\n  echo \"red 1 hour after this comment, anyone may revert the culprit PR.\"\n  echo \"The staging pull request runs the same lanes and blocks the promote.\"\n  echo\n  echo \"Reproduce one failing test with \\`pnpm test -- --id <FLOW>\\` or\"\n  echo \"\\`pnpm --filter <pkg> test <file>\\`. Rerun the lanes: \\`gh workflow run tests.yml\\`.\"\n} > /tmp/trunk-verdict.md\n\ngh api \"repos/$REPO/commits/$SHA/comments\" -F body=@/tmp/trunk-verdict.md --jq '.html_url'\necho \"::error::dev is red at $SHA (lanes: ${failed:-unknown})\"\nexit 1\n"
