name: CI

# Pull-request gate. Required to pass before merging into protected branches
# (SOC 2 CC8.1 — automated checks run on every change before review/merge).

on:
  # A push or pull request into `dev` runs no CI (Actions minutes, 2026-10-03).
  # The release pull request into `prod` is the gate; the pull request into
  # `staging` runs nothing (2026-10-16). A weekly schedule runs every job as a
  # safety net on `dev`.
  pull_request:
    branches: [prod]
  schedule:
    - cron: '53 4 * * 1' # weekly, Monday 04:53 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency + secret scan
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 15
    env:
      TRIVY_DB_REPOSITORY: 10.42.0.1:5000/aquasec/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasec/trivy-db:2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
