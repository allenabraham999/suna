name: BS warm store
on:
  workflow_dispatch:
    inputs:
      variant:
        description: warm | cold
        default: warm
permissions:
  contents: read
jobs:
  cli:
    name: CLI binary smoke ${{ inputs.variant }} ${{ matrix.copy }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        copy: [1, 2, 3]
    runs-on: vulcan-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      # Stand-in for a warm template: what prebake.sh does at template build
      # (pnpm fetch from the lockfile alone into /opt/vulcan/warm/pnpm-store),
      # then caches dropped. Not counted in the job's time.
      - name: SEED prebake stand-in
        if: inputs.variant == 'warm'
        run: |
          set -eux
          d=$(mktemp -d /var/tmp/pb.XXXX)
          for f in pnpm-lock.yaml package.json pnpm-workspace.yaml .npmrc; do
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/$f" -o "$d/$f" || true
          done
          sudo install -d -o runner -g runner /opt/vulcan/warm/pnpm-store
          cd "$d" && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm fetch --frozen-lockfile --store-dir /opt/vulcan/warm/pnpm-store --reporter=append-only 2>&1 | tail -5
          du -sh /opt/vulcan/warm/pnpm-store; find /opt/vulcan/warm/pnpm-store -type f | wc -l
          rm -rf "$d" ~/.cache/pnpm ~/.local/share/pnpm
          sync; echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null
          echo "npm_config_store_dir=/opt/vulcan/warm/pnpm-store" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install pnpm
        run: |
          corepack enable pnpm
          echo "pnpm: $(pnpm -v)  node: $(node -v)  bun: $(bun -v)"
      - name: Install dependencies (CLI + workspace deps)
        run: pnpm install --frozen-lockfile --filter "@kortix/cli..."
        env:
          npm_config_engine_strict: "false"
      - name: Build Linux CLI binary
        run: |
          bun build \
            --compile \
            --minify \
            --target=bun-linux-x64 \
            --outfile=/tmp/kortix-cli-smoke \
            apps/cli/src/index.ts
      - name: Smoke test binary
        run: /tmp/kortix-cli-smoke version

  desktop:
    name: Desktop installer smoke ${{ inputs.variant }} ${{ matrix.copy }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        copy: [1, 2, 3]
    runs-on: vulcan-4vcpu-ubuntu-2204
    timeout-minutes: 30
    steps:
      - name: SEED prebake stand-in
        if: inputs.variant == 'warm'
        run: |
          set -eux
          d=$(mktemp -d /var/tmp/pb.XXXX)
          for f in pnpm-lock.yaml package.json pnpm-workspace.yaml .npmrc; do
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/$f" -o "$d/$f" || true
          done
          sudo install -d -o runner -g runner /opt/vulcan/warm/pnpm-store
          cd "$d" && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm fetch --frozen-lockfile --store-dir /opt/vulcan/warm/pnpm-store --reporter=append-only 2>&1 | tail -5
          du -sh /opt/vulcan/warm/pnpm-store; find /opt/vulcan/warm/pnpm-store -type f | wc -l
          rm -rf "$d" ~/.cache/pnpm ~/.local/share/pnpm
          sync; echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null
          echo "npm_config_store_dir=/opt/vulcan/warm/pnpm-store" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @kortix/desktop-electron --filter @kortix/agent-tunnel
        env:
          npm_config_engine_strict: "false"
      - name: Ensure Electron runtime
        run: pnpm --filter @kortix/desktop-electron exec node scripts/ensure-runtime.js
      - name: Build Linux desktop installer (Electron, unsigned)
        run: pnpm --filter @kortix/desktop-electron exec electron-builder --linux --publish never
        env:
          KORTIX_DESKTOP_DEFAULT_URL: https://dev.kortix.com/projects
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify installer exists
        run: |
          shopt -s nullglob
          files=(apps/desktop-electron/dist/*.AppImage)
          test "${#files[@]}" -gt 0
          ls -lh "${files[@]}"
