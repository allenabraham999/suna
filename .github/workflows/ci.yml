name: bs-schema
on:
  workflow_dispatch:
    inputs:
      copies:
        default: '[1,2,3]'
      variant:
        description: 'base | dockerdrv | vulcanbuilder'
        default: 'base'
      runner:
        default: 'vulcan-4vcpu-ubuntu-2404'
      parallel:
        default: '1'
      touch_api:
        default: 'false'
      pnpm_sticky:
        default: 'false'
jobs:
  schema:
    name: Self-host schema bootstrap ${{ inputs.variant }} ${{ matrix.n }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix:
        n: ${{ fromJSON(inputs.copies) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Diag start
        run: |
          set +e
          date -u +%T; nproc; free -m | head -2
          echo "POOL-ID cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs) gw=$(ip route | awk '/default/{print $3; exit}')"
          echo "VULCAN_STICKY_DISK=${VULCAN_STICKY_DISK:-}"
          df -h / /mnt/vulcan-sticky 2>/dev/null
          sudo cat /mnt/vulcan-sticky/.vulcan/sticky.json 2>/dev/null; echo
          docker info --format '{{.DockerRootDir}} images={{.Images}} driver={{.Driver}}'
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | head -30
          docker system df
          docker volume ls

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install pnpm
        run: |
          corepack enable pnpm
          echo "pnpm: $(pnpm -v)  node: $(node -v)  bun: $(bun -v)"

      - name: pnpm store on sticky disk
        if: inputs.pnpm_sticky == 'true'
        run: |
          sudo mkdir -p /mnt/vulcan-sticky/pnpm-store && sudo chown runner:runner /mnt/vulcan-sticky/pnpm-store
          du -sh /mnt/vulcan-sticky/pnpm-store; echo "npm_config_store_dir=/mnt/vulcan-sticky/pnpm-store" >> $GITHUB_ENV
      - name: Install dependencies (CLI + workspace deps)
        run: |
          pnpm config get registry; cat ~/.npmrc 2>/dev/null || true; env | grep -i -E "npm_config|proxy" | grep -v -i token || true
          pnpm install --frozen-lockfile --filter "@kortix/cli..." --reporter=append-only 2>&1 | awk '{ print strftime("%H:%M:%S"), $0; fflush() }' | grep -v "^.\{9\}Progress" ; echo; pnpm store path; du -sh $(pnpm store path) 2>/dev/null; du -sh node_modules
        env:
          npm_config_engine_strict: "false"

      - name: Set up Docker Buildx
        if: inputs.variant == 'base'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Set up Docker Buildx (docker driver)
        if: inputs.variant == 'dockerdrv'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - name: Set up Docker builder (Vulcan sticky)
        if: inputs.variant == 'vulcanbuilder'
        run: |
          name=vulcan
          docker rm -f "buildx_buildkit_${name}0" >/dev/null 2>&1 || true
          docker buildx rm --keep-state "$name" >/dev/null 2>&1 || true
          args=(--name "$name" --driver docker-container --bootstrap --use)
          [ ! -s "$HOME/.docker/buildx/buildkitd.default.toml" ] || args+=(--buildkitd-config "$HOME/.docker/buildx/buildkitd.default.toml")
          docker buildx create "${args[@]}"

      - name: Simulate a PR code change in apps/api
        if: inputs.touch_api == 'true'
        run: echo "// bench ${{ github.run_id }}-${{ matrix.n }}" >> apps/api/src/index.ts
      - name: Build API image
        run: docker build --load --cache-from type=registry,ref=kortix/kortix-api:dev-buildcache --build-arg SERVICE=apps/api -f apps/api/Dockerfile -t kortix/kortix-api:selfhost-local .

      - name: Self-host schema-bootstrap check (fresh DB)
        run: bash apps/cli/scripts/self-host-e2e/schema-check.sh
        env:
          API_IMAGE: kortix/kortix-api:selfhost-local

      - name: pnpm probe
        if: always()
        run: |
          set +e
          du -sh node_modules/.pnpm/* 2>/dev/null | sort -h | tail -15
          find ~/.local/share/pnpm/store/v3 -type f | wc -l
          rm -rf node_modules apps/*/node_modules packages/*/node_modules
          t=$(date +%s.%N); pnpm install --frozen-lockfile --offline --filter "@kortix/cli..." >/dev/null 2>&1; echo "offline relink: $(echo "$(date +%s.%N) - $t" | bc)s"
      - name: Net and disk probe
        if: always()
        run: |
          set +e
          for u in https://registry.npmjs.org/typescript https://registry.npmjs.org/typescript/-/typescript-5.6.3.tgz https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-0.24.0.tgz; do
            curl -s -o /dev/null -w "%{time_connect} %{time_starttransfer} %{time_total} %{size_download} %{speed_download} $u\n" -H 'accept: application/vnd.npm.install-v1+json' $u; done
          getent hosts registry.npmjs.org
          dd if=/dev/zero of=$HOME/ddtest bs=1M count=1024 oflag=direct 2>&1 | tail -1; rm -f $HOME/ddtest
          python3 -c "
          import os,time
          d=os.path.expanduser('~/smallf'); os.makedirs(d,exist_ok=True); t=time.time()
          for i in range(20000):
              open(f'{d}/{i}','w').write('x'*100)
          print('20k small files',round(time.time()-t,2),'s')"
          rm -rf ~/smallf
      - name: Diag end
        if: always()
        run: |
          set +e
          df -h /mnt/vulcan-sticky 2>/dev/null
          docker system df
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | head -30
