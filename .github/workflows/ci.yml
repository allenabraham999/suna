# bench: serialized copy (one job at a time)
name: CI
'on':
  pull_request:
    branches:
    - prod
  schedule:
  - cron: 53 4 * * 1
  workflow_dispatch: null
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    name: Detect changes
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      cli: ${{ steps.filter.outputs.cli }}
      sandbox_agent: ${{ steps.filter.outputs.sandbox_agent }}
      sandbox_image: ${{ steps.filter.outputs.sandbox_image }}
      desktop: ${{ steps.filter.outputs.desktop }}
      self_host: ${{ steps.filter.outputs.self_host }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: "# Shared foundation for the pnpm-installed jobs (api/frontend/cli):\n# a change here can break any of their installs/typechecks.\npnpm: &pnpm\n  - 'pnpm-lock.yaml'\n  - 'pnpm-workspace.yaml'\n  - 'package.json'\n  - '.npmrc'\n  - 'tsconfig.base.json'\n  - '.github/workflows/ci.yml'\napi:\n  - *pnpm\n  - 'apps/api/**'\n  - 'apps/kortix-app-runtime/**'\n  - 'packages/agent-tunnel/**'\n  - 'packages/api-contract/**'\n  - 'packages/db/**'\n  - 'packages/manifest-schema/**'\n  - 'packages/shared/**'\n  - 'packages/starter/**'\nfrontend:\n  - *pnpm\n  - 'apps/web/**'\n  - 'packages/shared/**'\ncli:\n  - *pnpm\n  - 'apps/cli/**'\n  - 'packages/manifest-schema/**'\n  - 'packages/starter/**'\nsandbox_agent:\n  - '.github/workflows/ci.yml'\n  - 'tsconfig.base.json'\n  - 'apps/kortix-sandbox-agent-server/**'\n  # Bundled into the daemon (KORTIXD_SHARED_SOURCES).\n  - 'packages/api-contract/src/**'\n  - 'packages/sdk/src/core/session/wire-message-id.ts'\nsandbox_image:\n  - '.github/workflows/ci.yml'\n  - 'apps/sandbox/Dockerfile'\n  - 'scripts/check-sandbox-apt-packages.sh'\ndesktop:\n  - '.github/workflows/ci.yml'\n  - 'apps/desktop-electron/**'\n# self-host stack: anything that can break `kortix self-host start`'s\n# from-scratch DB bootstrap or the CLI's compose generation.\nself_host:\n  - *pnpm\n  - 'apps/api/Dockerfile'\n  - 'apps/kortix-app-runtime/**'\n  - 'apps/api/src/snapshots/builder.ts'\n  - 'apps/api/src/config.ts'\n  - 'packages/db/**'\n  - 'apps/cli/src/commands/self-host.ts'\n  - 'apps/cli/src/self-host/**'\n  - 'apps/cli/scripts/self-host-e2e/**'\n"
  frontend-build:
    name: Frontend build
    needs:
    - changes
    if: ${{ !cancelled() && (needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request') }}
    runs-on: ${{ vars.CI_RUNNER_XL || vars.CI_RUNNER_L || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.3
    - name: Install pnpm
      run: 'corepack enable pnpm

        echo "pnpm: $(pnpm -v)  node: $(node -v)"

        '
    - name: Install dependencies (frontend + workspace deps)
      run: pnpm install --frozen-lockfile --filter "./apps/web..."
      env:
        npm_config_engine_strict: 'false'
    - name: Restore ESLint cache
      uses: actions/cache@v4
      with:
        path: apps/web/.eslintcache
        key: eslint-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: 'eslint-web-${{ runner.os }}-${{ hashFiles(''pnpm-lock.yaml'') }}-

          '
    - name: Enforce frontend lint
      run: pnpm --dir apps/web exec eslint src --quiet --cache --cache-strategy content --cache-location .eslintcache
    - name: Restore Turbopack build cache
      uses: actions/cache@v4
      with:
        path: apps/web/.next/cache
        key: nextjs-turbopack-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: 'nextjs-turbopack-${{ runner.os }}-${{ hashFiles(''pnpm-lock.yaml'') }}-

          '
    - name: Build standalone frontend
      run: pnpm --filter ./apps/web build
      env:
        NODE_OPTIONS: --max-old-space-size=6144
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8008/v1
        NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: local-build-placeholder-anon-key
        NEXT_PUBLIC_BILLING_ENABLED: 'false'
        NEXT_OUTPUT: standalone
  sandbox-agent-build:
    name: Sandbox agent build
    needs:
    - changes
    - frontend-build
    if: ${{ !cancelled() && (needs.changes.outputs.sandbox_agent == 'true' || github.event_name != 'pull_request') }}
    runs-on: ${{ vars.CI_RUNNER_M || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.3
    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
    - name: Install dependencies
      run: bun install --frozen-lockfile
      working-directory: apps/kortix-sandbox-agent-server
    - name: Import boundaries
      run: bun run lint && bun run test:architecture
      working-directory: apps/kortix-sandbox-agent-server
    - name: Build Linux sandbox agent daemon
      run: BUN_COMPILE_TARGET=bun-linux-x64 bun run build
      working-directory: apps/kortix-sandbox-agent-server
    - name: Verify binary exists
      run: 'test -x apps/kortix-sandbox-agent-server/dist/kortix-agent

        ls -lh apps/kortix-sandbox-agent-server/dist/kortix-agent

        '
  sandbox-image-packages:
    name: Sandbox image apt packages
    needs:
    - changes
    - sandbox-agent-build
    if: ${{ !cancelled() && (needs.changes.outputs.sandbox_image == 'true' || github.event_name != 'pull_request') }}
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Every apt package the sandbox image installs resolves
      run: bash scripts/check-sandbox-apt-packages.sh
  cli-binary-smoke:
    name: CLI binary smoke
    needs:
    - changes
    - sandbox-image-packages
    if: ${{ !cancelled() && (needs.changes.outputs.cli == 'true' || github.event_name != 'pull_request') }}
    runs-on: ${{ vars.CI_RUNNER_M || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.3
    - name: Install pnpm
      run: 'corepack enable pnpm

        echo "pnpm: $(pnpm -v)  node: $(node -v)  bun: $(bun -v)"

        '
    - name: Install dependencies (CLI + workspace deps)
      run: pnpm install --frozen-lockfile --filter "@kortix/cli..."
      env:
        npm_config_engine_strict: 'false'
    - name: Build Linux CLI binary
      run: "bun build \\\n  --compile \\\n  --minify \\\n  --target=bun-linux-x64 \\\n  --outfile=/tmp/kortix-cli-smoke \\\n  apps/cli/src/index.ts\n"
    - name: Smoke test binary
      run: /tmp/kortix-cli-smoke version
  self-host-schema:
    name: Self-host schema bootstrap
    needs:
    - changes
    - cli-binary-smoke
    if: ${{ !cancelled() && (needs.changes.outputs.self_host == 'true' || github.event_name != 'pull_request') }}
    runs-on: ${{ vars.CI_RUNNER_M || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.3
    - name: Install pnpm
      run: 'corepack enable pnpm

        echo "pnpm: $(pnpm -v)  node: $(node -v)  bun: $(bun -v)"

        '
    - name: Install dependencies (CLI + workspace deps)
      run: pnpm install --frozen-lockfile --filter "@kortix/cli..."
      env:
        npm_config_engine_strict: 'false'
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        driver: docker
    - name: Build API image
      run: docker build --load --cache-from type=registry,ref=kortix/kortix-api:dev-buildcache --build-arg SERVICE=apps/api -f apps/api/Dockerfile -t kortix/kortix-api:selfhost-local .
    - name: Self-host schema-bootstrap check (fresh DB)
      run: bash apps/cli/scripts/self-host-e2e/schema-check.sh
      env:
        API_IMAGE: kortix/kortix-api:selfhost-local
  desktop-installer-smoke:
    name: Desktop installer smoke
    needs:
    - changes
    - self-host-schema
    if: ${{ !cancelled() && (needs.changes.outputs.desktop == 'true' || github.event_name != 'pull_request') }}
    runs-on: ${{ vars.CI_RUNNER_M_2204 || 'ubuntu-22.04' }}
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
    - name: Install pnpm
      run: corepack enable pnpm
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.3
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --filter @kortix/desktop-electron --filter @kortix/agent-tunnel
      env:
        npm_config_engine_strict: 'false'
    - name: Ensure Electron runtime
      run: pnpm --filter @kortix/desktop-electron exec node scripts/ensure-runtime.js
    - name: Build Linux desktop installer (Electron, unsigned)
      run: pnpm --filter @kortix/desktop-electron exec electron-builder --linux --publish never
      env:
        KORTIX_DESKTOP_DEFAULT_URL: https://dev.kortix.com/projects
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    - name: Verify installer exists
      run: 'shopt -s nullglob

        files=(apps/desktop-electron/dist/*.AppImage)

        test "${#files[@]}" -gt 0

        ls -lh "${files[@]}"

        '
  dependency-scan:
    name: Dependency + secret scan
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Trivy filesystem (fail on CRITICAL)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,secret
        severity: CRITICAL
        ignore-unfixed: true
        exit-code: '1'
        format: table
    needs:
    - desktop-installer-smoke
    if: ${{ !cancelled() && (true) }}
