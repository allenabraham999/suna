name: Archive steer check

on:
  workflow_dispatch:
    inputs:
      tag:
        description: variant tag
        default: v2

permissions:
  contents: read

jobs:
  steer:
    name: steer ${{ matrix.image }} ${{ matrix.n }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image: ['2404', '2204']
        n: [1]
    runs-on: ${{ matrix.image == '2204' && vars.CI_RUNNER_M_2204 || vars.CI_RUNNER_S }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github }
      - name: Where am I
        run: |
          echo "runner=$RUNNER_NAME"; cat /etc/os-release | grep VERSION=; nft --version || true; iptables --version || true
          docker info 2>/dev/null | grep -iE 'iptables|Server Version' || true
          echo "--- v6"; ip -6 route show default || true; getent ahostsv6 archive.ubuntu.com | awk '{print $1}' | sort -u | head
          curl -6 -s -o /dev/null -m 4 -w 'v6 http %{http_code} %{time_total}\n' http://archive.ubuntu.com/ubuntu/ || echo "no v6 egress"
      - name: Simulate two dead archive addresses (drop after any DNAT)
        if: inputs.tag == 'dead'
        run: |
          sudo nft -f - <<'NFT'
          table inet testdrop {
            chain dropout { type filter hook output priority 0; policy accept; ip daddr { 91.189.91.82, 91.189.91.83 } tcp dport 80 drop; }
            chain dropfwd { type filter hook forward priority 0; policy accept; ip daddr { 91.189.91.82, 91.189.91.83 } tcp dport 80 drop; }
          }
          NFT
          curl -s -o /dev/null -m 4 --resolve archive.ubuntu.com:80:91.189.91.82 -w 'control (no steering yet): %{size_download} B %{time_total}s\n' http://archive.ubuntu.com/ubuntu/ls-lR.gz || echo "control: .82 unreachable as intended"
      - name: Boot path (setup + job-started hook), as run-job.sh runs it
        run: |
          sudo install -m 0644 .github/vulcan-archive.sh /opt/vulcan-archive-test.sh
          t0=$(date +%s.%N)
          sudo bash -c '. /opt/vulcan-archive-test.sh'
          hook=$(sudo sed -n 's/^ACTIONS_RUNNER_HOOK_JOB_STARTED=//p' /home/runner/actions-runner/.env | tail -n 1)
          echo "hook=$hook"
          bash /var/lib/vulcan/archive/job-started.sh | head -n 3
          echo "hook returned after $(awk -v a=$t0 -v b=$(date +%s.%N) 'BEGIN{printf "%.1f", b-a}')s"
          sudo cat /var/log/vulcan-archive.log
          sudo nft list table ip vulcan_archive 2>/dev/null || echo "no table"
      - name: Every address, through the table
        run: |
          for ip in $(getent ahostsv4 archive.ubuntu.com security.ubuntu.com | awk '{print $1}' | sort -u); do
            curl -s -o /dev/null -r 0-2097151 -m 8 --resolve archive.ubuntu.com:80:$ip -w "$ip %{size_download} B %{time_total}s\n" http://archive.ubuntu.com/ubuntu/ls-lR.gz || true
          done
      - name: apt in the VM pinned to a dead address
        run: |
          dead=$(sudo nft list table ip vulcan_archive 2>/dev/null | sed -n 's/.*ip daddr { \([0-9.]*\).*/\1/p' | head -n 1)
          echo "dead=${dead:-none (using 91.189.91.82)}"; dead=${dead:-91.189.91.82}
          echo "$dead archive.ubuntu.com security.ubuntu.com" | sudo tee -a /etc/hosts
          ls /etc/apt/sources.list.d/ ; grep -rh '^URIs\|^deb ' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | head -4
          time sudo timeout 300 apt-get update -o Acquire::Retries=0 2>&1 | tail -n 4
          sudo sed -i "/^$dead archive/d" /etc/hosts
      - name: docker build pinned to a dead address (forwarded path)
        run: |
          dead=$(sudo nft list table ip vulcan_archive 2>/dev/null | sed -n 's/.*ip daddr { \([0-9.]*\).*/\1/p' | head -n 1); dead=${dead:-91.189.91.82}
          mkdir -p /tmp/b && printf 'FROM ubuntu:24.04\nRUN apt-get update -o Acquire::Retries=0 && echo APT-OK\n' > /tmp/b/Dockerfile
          time timeout 300 docker build --no-cache --progress=plain --add-host archive.ubuntu.com:$dead --add-host security.ubuntu.com:$dead /tmp/b 2>&1 | grep -E 'APT-OK|Fetched|ERROR|DONE [0-9.]+s$' | tail -n 6
      - name: container (docker run, bridge) pinned to a dead address
        run: |
          dead=$(sudo nft list table ip vulcan_archive 2>/dev/null | sed -n 's/.*ip daddr { \([0-9.]*\).*/\1/p' | head -n 1); dead=${dead:-91.189.91.82}
          time timeout 300 docker run --rm --add-host archive.ubuntu.com:$dead --add-host security.ubuntu.com:$dead ubuntu:22.04 bash -c 'apt-get update -o Acquire::Retries=0 | tail -n 2'
