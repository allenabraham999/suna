name: BS desktop
on:
  workflow_dispatch:
    inputs:
      runner:
        default: vulcan-4vcpu-ubuntu-2204
      variant:
        default: baseline
permissions:
  contents: read
jobs:
  desktop:
    name: Desktop installer smoke ${{ matrix.v }} ${{ matrix.copy }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        copy: [1, 2, 3]
        v: [nc64, warm]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Probe (background)
        run: |
          cat /etc/resolv.conf | grep -v '^#'
          mkdir -p /tmp/probe
          nohup bash -c 'while :; do
            t=$(date +%T.%N | cut -c1-12)
            n=$(curl -s -o /dev/null -m 10 -w "%{time_namelookup}/%{time_connect}/%{time_appconnect}/%{time_total}/%{http_code}" https://registry.npmjs.org/-/ping)
            g=$(curl -s -o /dev/null -m 10 -w "%{time_namelookup}/%{time_connect}/%{time_appconnect}/%{time_total}/%{http_code}" https://github.com/robots.txt)
            st=$(awk "/^cpu /{print \$9}" /proc/stat)
            echo "$t npm=$n gh=$g steal=$st load=$(cut -d" " -f1 /proc/loadavg)"
            sleep 1
          done' > /tmp/probe/net.log 2>&1 &
          vmstat 1 > /tmp/probe/vmstat.log 2>&1 &

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          if [ "${{ matrix.v }}" = nc64 ]; then export npm_config_network_concurrency=64; fi
          df -T / /mnt/vulcan-sticky 2>/dev/null; findmnt /mnt/vulcan-sticky 2>/dev/null; ls ~/.local/share/pnpm/store 2>&1 || true
          pnpm install --frozen-lockfile --filter @kortix/desktop-electron --filter @kortix/agent-tunnel --reporter=append-only --loglevel=info
        env:
          npm_config_engine_strict: "false"

      - name: Second install (warm store)
        if: matrix.v == 'warm'
        run: |
          rm -rf node_modules apps/*/node_modules packages/*/node_modules
          sync; echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null || true
          pnpm install --frozen-lockfile --filter @kortix/desktop-electron --filter @kortix/agent-tunnel --reporter=append-only --loglevel=info
        env:
          npm_config_engine_strict: "false"

      - name: Ensure Electron runtime
        run: pnpm --filter @kortix/desktop-electron exec node scripts/ensure-runtime.js

      - name: Build Linux desktop installer (Electron, unsigned)
        run: pnpm --filter @kortix/desktop-electron exec electron-builder --linux --publish never
        env:
          KORTIX_DESKTOP_DEFAULT_URL: https://dev.kortix.com/projects
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify installer exists
        run: |
          shopt -s nullglob
          files=(apps/desktop-electron/dist/*.AppImage)
          test "${#files[@]}" -gt 0
          ls -lh "${files[@]}"

      - name: Diag
        if: always()
        run: |
          set +e
          nproc; free -m; df -h / /tmp | cat
          node -v; bun -v; pnpm -v; which node bun pnpm
          env | grep -iE 'npm|pnpm|electron|proxy|cache|vulcan|bun_' | sed -E 's/(token|secret)=.*/\1=***/I' | sort
          pnpm store path; du -sh "$(pnpm store path)" 2>/dev/null
          ls -la ~/.cache 2>/dev/null; du -sh ~/.cache/* 2>/dev/null
          cat /etc/os-release | head -3
          echo ==== net; cat /tmp/probe/net.log
          echo ==== vmstat; cat /tmp/probe/vmstat.log
