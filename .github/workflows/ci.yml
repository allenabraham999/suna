name: CI

# Pull-request gate. Required to pass before merging into protected branches
# (SOC 2 CC8.1 — automated checks run on every change before review/merge).

on:
  # A push or pull request into `dev` runs no CI (Actions minutes, 2026-10-03).
  # The release pull request into `prod` is the gate; the pull request into
  # `staging` runs nothing (2026-10-16). A weekly schedule runs every job as a
  # safety net on `dev`.
  pull_request:
    branches: [prod]
  schedule:
    - cron: '53 4 * * 1' # weekly, Monday 04:53 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      cli: ${{ steps.filter.outputs.cli }}
      sandbox_agent: ${{ steps.filter.outputs.sandbox_agent }}
      sandbox_image: ${{ steps.filter.outputs.sandbox_image }}
      desktop: ${{ steps.filter.outputs.desktop }}
      self_host: ${{ steps.filter.outputs.self_host }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Shared foundation for the pnpm-installed jobs (api/frontend/cli):
            # a change here can break any of their installs/typechecks.
            pnpm: &pnpm
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.npmrc'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
            api:
              - *pnpm
              - 'apps/api/**'
              - 'apps/kortix-app-runtime/**'
              - 'packages/agent-tunnel/**'
              - 'packages/api-contract/**'
              - 'packages/db/**'
              - 'packages/manifest-schema/**'
              - 'packages/shared/**'
              - 'packages/starter/**'
            frontend:
              - *pnpm
              - 'apps/web/**'
              - 'packages/shared/**'
            cli:
              - *pnpm
              - 'apps/cli/**'
              - 'packages/manifest-schema/**'
              - 'packages/starter/**'
            sandbox_agent:
              - '.github/workflows/ci.yml'
              - 'tsconfig.base.json'
              - 'apps/kortix-sandbox-agent-server/**'
              # Bundled into the daemon (KORTIXD_SHARED_SOURCES).
              - 'packages/api-contract/src/**'
              - 'packages/sdk/src/core/session/wire-message-id.ts'
            sandbox_image:
              - '.github/workflows/ci.yml'
              - 'apps/sandbox/Dockerfile'
              - 'scripts/check-sandbox-apt-packages.sh'
            desktop:
              - '.github/workflows/ci.yml'
              - 'apps/desktop-electron/**'
            # self-host stack: anything that can break `kortix self-host start`'s
            # from-scratch DB bootstrap or the CLI's compose generation.
            self_host:
              - *pnpm
              - 'apps/api/Dockerfile'
              - 'apps/kortix-app-runtime/**'
              - 'apps/api/src/snapshots/builder.ts'
              - 'apps/api/src/config.ts'
              - 'packages/db/**'
              - 'apps/cli/src/commands/self-host.ts'
              - 'apps/cli/src/self-host/**'
              - 'apps/cli/scripts/self-host-e2e/**'

  # No API typecheck here: the `packages-api` contract lane runs
  # `pnpm --filter kortix-api typecheck` on the same release tree
  # (tests/bin/package-quality.ts), so a job here was the same tsc twice.

  self-host-schema:
    name: Self-host schema bootstrap
    needs: changes
    if: needs.changes.outputs.self_host == 'true' || github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_M || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      # bench experiment: dockerd classic image store (overlay2) instead of
      # the containerd snapshotter, switched at job start.
      - name: dockerd classic image store
        run: |
          f=/etc/docker/daemon.json
          echo "before: $(sudo cat $f 2>/dev/null || echo none)"
          docker info --format 'before: driver={{.Driver}} root={{.DockerRootDir}} images={{.Images}}'
          (sudo cat $f 2>/dev/null || echo '{}') | jq '.features["containerd-snapshotter"]=false' > /tmp/daemon.json
          sudo cp /tmp/daemon.json $f
          t0=$(date +%s.%N); sudo systemctl restart docker; t1=$(date +%s.%N)
          echo "restart took $(echo "$t1 - $t0" | bc)s"
          docker info --format 'after: driver={{.Driver}} root={{.DockerRootDir}} images={{.Images}}'
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install pnpm
        run: |
          corepack enable pnpm
          echo "pnpm: $(pnpm -v)  node: $(node -v)  bun: $(bun -v)"

      - name: Install dependencies (CLI + workspace deps)
        run: pnpm install --frozen-lockfile --filter "@kortix/cli..."
        env:
          npm_config_engine_strict: "false"

      # driver: docker builds in the daemon's own BuildKit: no builder
      # container to pull and boot, its layer cache persists wherever the
      # daemon's does, and the image lands straight in the local store for
      # the compose stack below. The dev image's registry cache warms it
      # (read-only; importing a registry cache works with this driver).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - name: Build API image
        run: docker build --load --cache-from type=registry,ref=kortix/kortix-api:dev-buildcache --build-arg SERVICE=apps/api -f apps/api/Dockerfile -t kortix/kortix-api:selfhost-local .

      - name: Self-host schema-bootstrap check (fresh DB)
        run: bash apps/cli/scripts/self-host-e2e/schema-check.sh
        env:
          API_IMAGE: kortix/kortix-api:selfhost-local

