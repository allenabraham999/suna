name: BS desktop+cli (warm store stand-in, release cache stand-in)
on:
  workflow_dispatch:
    inputs:
      copies:
        default: '4'
permissions:
  contents: read
jobs:
  cli:
    name: CLI binary smoke ${{ matrix.v }} ${{ matrix.copy }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        v: [warm]
        copy: [1, 2, 3, 4]
    runs-on: ${{ vars.CI_RUNNER_M || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: SEED
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/bs/seed.sh)" seed ${{ matrix.v }} ${{ github.repository }} ${{ github.sha }}
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install pnpm
        run: |
          corepack enable pnpm
          echo "pnpm: $(pnpm -v)  node: $(node -v)  bun: $(bun -v)"
      - name: Install dependencies (CLI + workspace deps)
        run: pnpm install --frozen-lockfile --filter "@kortix/cli..."
        env:
          npm_config_engine_strict: "false"
      - name: Build Linux CLI binary
        run: bun build --compile --minify --target=bun-linux-x64 --outfile=/tmp/kortix-cli-smoke apps/cli/src/index.ts
      - name: Smoke test binary
        run: /tmp/kortix-cli-smoke version

  desktop:
    name: Desktop installer smoke ${{ matrix.v }} ${{ matrix.copy }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        v: [warm, warmrc]
        copy: [1, 2, 3, 4]
    runs-on: ${{ vars.CI_RUNNER_M_2204 || 'ubuntu-22.04' }}
    timeout-minutes: 30
    steps:
      - name: SEED
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/bs/seed.sh)" seed ${{ matrix.v }} ${{ github.repository }} ${{ github.sha }}
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @kortix/desktop-electron --filter @kortix/agent-tunnel
        env:
          npm_config_engine_strict: "false"
      - name: Ensure Electron runtime
        run: pnpm --filter @kortix/desktop-electron exec node scripts/ensure-runtime.js
      - name: Build Linux desktop installer (Electron, unsigned)
        run: pnpm --filter @kortix/desktop-electron exec electron-builder --linux --publish never
        env:
          KORTIX_DESKTOP_DEFAULT_URL: https://dev.kortix.com/projects
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify installer exists
        run: |
          shopt -s nullglob
          files=(apps/desktop-electron/dist/*.AppImage)
          test "${#files[@]}" -gt 0
          ls -lh "${files[@]}"
      - name: Diag
        if: always()
        run: |
          curl -s http://127.0.0.1:7471/stats 2>/dev/null; echo; tail -5 /tmp/ap.log 2>/dev/null
          ls -la ~/.cache/electron ~/.cache/electron-builder 2>/dev/null | head -20
