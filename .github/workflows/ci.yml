name: Sandbox agent bench

on:
  workflow_dispatch:
    inputs:
      runner:
        description: runs-on label
        default: vulcan-4vcpu-ubuntu-2404
      copies:
        description: JSON list of copy ids
        default: '[1,2,3,4,5]'
      variant:
        description: experiment variant
        default: base
      parallel:
        default: '3'

permissions:
  contents: read

jobs:
  sandbox-agent:
    name: Sandbox agent build (${{ inputs.variant }} ${{ matrix.copy }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix:
        copy: ${{ fromJSON(inputs.copies) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/kortix-sandbox-agent-server

      - name: Import boundaries
        run: bun run lint && bun run test:architecture
        working-directory: apps/kortix-sandbox-agent-server

      - name: Build Linux sandbox agent daemon
        run: BUN_COMPILE_TARGET=bun-linux-x64 bun run build
        working-directory: apps/kortix-sandbox-agent-server

      - name: Verify binary exists
        run: |
          test -x apps/kortix-sandbox-agent-server/dist/kortix-agent
          ls -lh apps/kortix-sandbox-agent-server/dist/kortix-agent

      - name: Probe (not part of the real job)
        if: always()
        working-directory: apps/kortix-sandbox-agent-server
        run: |
          set +e
          echo "nproc=$(nproc) mem=$(free -m | awk '/Mem/{print $2}')MB"
          uname -r; cat /proc/loadavg
          echo "bun cache: $(du -sh ~/.bun/install/cache 2>/dev/null)"; ls ~/.bun/install/cache 2>/dev/null | wc -l
          env | grep -i -E 'proxy|BUN_|npm_config' | sed 's/=.*token.*/=<redacted>/I'
          V=$(bun --version)
          for i in 1 2; do curl -sSL -o /dev/null -w "bun zip: %{size_download}B in %{time_total}s (connect %{time_connect} ttfb %{time_starttransfer}) %{speed_download}B/s via %{url_effective}\n" https://github.com/oven-sh/bun/releases/download/bun-v$V/bun-linux-x64.zip; done
          curl -sS -o /dev/null -w "api tags: %{time_total}s\n" https://api.github.com/repos/oven-sh/bun/git/refs/tags
          curl -sS -o /dev/null -w "npm registry: %{time_total}s\n" https://registry.npmjs.org/hono
          rm -rf node_modules dist
          /usr/bin/time -f "cold bun install (no node_modules): %es" bun install --frozen-lockfile >/dev/null 2>&1
          /usr/bin/time -f "lint again: %es" bun run lint >/dev/null 2>&1
          /usr/bin/time -f "arch test again: %es" bun run test:architecture >/dev/null 2>&1
          /usr/bin/time -f "build again: %es" env BUN_COMPILE_TARGET=bun-linux-x64 bun run build >/dev/null 2>&1
