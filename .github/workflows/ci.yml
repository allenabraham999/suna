name: CI

# Pull-request gate. Required to pass before merging into protected branches
# (SOC 2 CC8.1 — automated checks run on every change before review/merge).

on:
  # A push or pull request into `dev` runs no CI (Actions minutes, 2026-10-03).
  # The release pull request into `prod` is the gate; the pull request into
  # `staging` runs nothing (2026-10-16). A weekly schedule runs every job as a
  # safety net on `dev`.
  pull_request:
    branches: [prod]
  schedule:
    - cron: '53 4 * * 1' # weekly, Monday 04:53 UTC
  workflow_dispatch:


permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend build (${{ matrix.size }} ${{ matrix.copy }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        copy: [1, 2, 3, 4, 5]
        mode: [warm]
        size: [vulcan-4vcpu-ubuntu-2404, vulcan-8vcpu-ubuntu-2404]
    runs-on: ${{ matrix.size }}
    timeout-minutes: 20
    steps:
      - name: Probe
        run: |
          nproc; free -m; df -h / /tmp | tail -2; uptime; cat /proc/loadavg
          env | grep -E '^(ACTIONS_RESULTS_URL|CUSTOM_ACTIONS|ACTIONS_CACHE)' | sed 's/=.*//' || true
          for p in $(pgrep -f /opt/vulcan/edge); do sudo cat /proc/$p/environ | tr '\0' '\n' | grep -E '^VULCAN_(CACHE_URL|EDGE)' ; done || true
          sudo grep -h -E 'CACHE_URL|REMOTE' /home/runner/actions-runner/.env /var/log/vulcan-*.log 2>/dev/null | grep -v TOKEN | head || true
          dd if=/dev/zero of=$RUNNER_TEMP/dd.bin bs=4M count=256 conv=fdatasync 2>&1 | tail -1; rm -f $RUNNER_TEMP/dd.bin
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install pnpm
        run: |
          corepack enable pnpm
          echo "pnpm: $(pnpm -v)  node: $(node -v)"

      - name: Install dependencies (frontend + workspace deps)
        run: pnpm install --frozen-lockfile --filter "./apps/web..."
        env:
          npm_config_engine_strict: "false"

      # src/sdk-boundary.test.ts runs in the `packages-rest` contract lane
      # (apps/web `bun test`); only the lint is unique to this job.
      - name: Enforce frontend lint
        run: pnpm --dir apps/web exec eslint src --quiet

      # Next.js 16.3 turns on Turbopack's FileSystem cache for `next build`
      # (`experimental.turbopackFileSystemCacheForBuild`, default true) and
      # writes it to apps/web/.next/cache/turbopack. A bare runner starts with
      # no .next, so without this step 16.3 pays the cost of WRITING that cache
      # on every run and never reads it back. Restoring it is what turns the
      # 16.3 build-cache feature into an actual CI speedup.
      #
      # Key on the lockfile plus this run's SHA so every run saves a fresh
      # entry (actions/cache never overwrites an existing key); the restore-key
      # falls back to the newest entry built against the same dependency set.
      # Turbopack invalidates per-file from its own content hashes, so a
      # restored cache from an older SHA is a valid starting point, not a
      # source of stale output.
      #
      # The fallback deliberately stops at the lockfile hash. A broader
      # `nextjs-turbopack-<os>-` key would also match caches built against a
      # DIFFERENT next version, whose on-disk cache format need not be
      # compatible — that is ~1GB downloaded to be discarded. Upstream's recipe
      # scopes its restore-keys to the lockfile for the same reason:
      # https://nextjs.org/docs/app/guides/ci-build-caching
      #
      # Verified on this PR: run 1 logged "Cache not found" then "Cache saved";
      # a re-run logged "Cache restored from key" and the Turbopack compile
      # went 105s -> 1.549s.
      - name: Restore Turbopack build cache
        id: tcache
        uses: actions/cache/restore@v4
        with:
          path: apps/web/.next/cache
          key: ${{ matrix.mode == 'cold' && format('cold-{0}-{1}-', github.run_id, matrix.copy) || '' }}nextjs-turbopack-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.copy }}
          restore-keys: |
            ${{ matrix.mode == 'cold' && format('cold-{0}-{1}-', github.run_id, matrix.copy) || '' }}nextjs-turbopack-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build standalone frontend
        run: pnpm --filter ./apps/web build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8008/v1
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local-build-placeholder-anon-key
          NEXT_PUBLIC_BILLING_ENABLED: "false"
          NEXT_OUTPUT: standalone

      - name: Save Turbopack build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: apps/web/.next/cache
          key: ${{ steps.tcache.outputs.cache-primary-key }}

      - name: Edge diagnostics
        if: always()
        run: |
          sudo cat /var/log/vulcan-edge.log 2>/dev/null | tail -40 || true
          curl -s http://$(hostname -I | awk '{print $1}'):7480/edge-health || true; echo
          cat /proc/loadavg; grep -E '^cpu ' /proc/stat
          for u in https://registry.npmjs.org/next/-/next-16.0.0.tgz https://fonts.gstatic.com/s/inter/v20/UcC53FwrK3iLTcvneQg7Ca725JhhKnNqk6L5UUMbndwV.woff2; do
            curl -s -o /dev/null -w "$u %{http_code} %{size_download}B %{time_connect}s conn %{time_starttransfer}s ttfb %{time_total}s total %{speed_download}B/s\n" "$u" || echo "$u failed"
          done

      - name: Offline reinstall probe
        if: always()
        run: |
          rm -rf node_modules apps/*/node_modules packages/*/node_modules
          /usr/bin/time -f "offline install %es" pnpm install --frozen-lockfile --offline --filter "./apps/web..." >/dev/null 2>$RUNNER_TEMP/t.txt; tail -1 $RUNNER_TEMP/t.txt
          du -sh $(pnpm store path) || true
      - name: Sizes
        if: always()
        run: du -sh apps/web/.next/cache apps/web/.next/cache/* ~/.local/share/pnpm/store 2>/dev/null || true; pnpm store path || true

