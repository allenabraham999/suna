name: bs-cli
on:
  workflow_dispatch:
    inputs:
      copies:
        default: '[1,2,3]'
      runner:
        default: 'vulcan-4vcpu-ubuntu-2404'
      bun:
        default: 'latest'
      prefault:
        default: '0'
jobs:
  cli:
    name: CLI binary smoke ${{ matrix.n }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        n: ${{ fromJSON(inputs.copies) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun }}

      - name: Install pnpm
        run: |
          corepack enable pnpm
          echo "pnpm: $(pnpm -v)  node: $(node -v)  bun: $(bun -v)"

      - name: MemDiag
        if: inputs.prefault == 'diag'
        run: |
          set +e
          uname -r; cat /proc/cmdline; nproc; free -m | head -2
          cat /sys/kernel/mm/transparent_hugepage/enabled
          lsmod | grep -iE 'balloon|virtio' ; ls /sys/bus/virtio/drivers/
          for d in /sys/bus/virtio/devices/*; do echo "$d $(cat $d/device) $(readlink $d/driver | xargs basename 2>/dev/null) features=$(cat $d/features)"; done
          sudo dmesg | grep -iE 'balloon|hugepage|memory:|kvm|hypervisor' | head -20
          cat > /tmp/touch.py <<'PY'
          import mmap,time,sys
          n=int(sys.argv[1])<<30
          for rnd in range(3):
            m=mmap.mmap(-1,n); t=time.time()
            for o in range(0,n,4096): m[o]=1
            t1=time.time()-t; t=time.time()
            for o in range(0,n,4096): m[o]=2
            print(f"round{rnd} first-touch {n>>30}G {t1:.2f}s  re-touch {time.time()-t:.2f}s", flush=True)
            m.close()
          PY
          python3 /tmp/touch.py 4
          grep -E 'MemFree|Cached' /proc/meminfo
          sudo rmmod virtio_balloon 2>&1 && echo "balloon removed" && python3 /tmp/touch.py 4
      - name: Prefault
        if: inputs.prefault != '0' && inputs.prefault != 'diag'
        run: |
          free -m | head -2; grep -E 'AnonHugePages|MemFree' /proc/meminfo
          /usr/bin/time -f "prefault ${{ inputs.prefault }}G wall=%e sys=%S" sh -c 'head -c ${{ inputs.prefault }}G /dev/zero > /dev/shm/pf; rm /dev/shm/pf'
          /usr/bin/time -f "prefault-again wall=%e sys=%S" sh -c 'head -c ${{ inputs.prefault }}G /dev/zero > /dev/shm/pf; rm /dev/shm/pf'
      - name: Pre-diag
        if: false
        run: |
          set +e; df -h / ; mount | grep -E ' / |sticky|home' ; ls -la ~/.local/share/pnpm 2>&1; readlink -f ~/.local/share/pnpm/store; du -sh ~/.local/share/pnpm/store 2>&1; ls ~/.local/share/pnpm/store/v3 2>&1 | head; ls /mnt/vulcan-sticky 2>&1 | head; cat /proc/pressure/io 2>/dev/null; uptime
      - name: Install dependencies (CLI + workspace deps)
        run: /usr/bin/time -f "install wall=%e user=%U sys=%S" pnpm install --frozen-lockfile --filter "@kortix/cli..."
        env:
          npm_config_engine_strict: "false"

      - name: Build Linux CLI binary
        run: |
          bun build \
            --compile \
            --minify \
            --target=bun-linux-x64 \
            --outfile=/tmp/kortix-cli-smoke \
            apps/cli/src/index.ts

      - name: Smoke test binary
        run: /tmp/kortix-cli-smoke version

