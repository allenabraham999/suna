name: Overhead bench

on:
  pull_request:
    branches: [bs/overhead-base]
  workflow_dispatch:
    inputs:
      tag:
        description: variant tag
        default: base

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      cli: ${{ steps.filter.outputs.cli }}
      sandbox_agent: ${{ steps.filter.outputs.sandbox_agent }}
      sandbox_image: ${{ steps.filter.outputs.sandbox_image }}
      desktop: ${{ steps.filter.outputs.desktop }}
      self_host: ${{ steps.filter.outputs.self_host }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Shared foundation for the pnpm-installed jobs (api/frontend/cli):
            # a change here can break any of their installs/typechecks.
            pnpm: &pnpm
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.npmrc'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
            api:
              - *pnpm
              - 'apps/api/**'
              - 'apps/kortix-app-runtime/**'
              - 'packages/agent-tunnel/**'
              - 'packages/api-contract/**'
              - 'packages/db/**'
              - 'packages/manifest-schema/**'
              - 'packages/shared/**'
              - 'packages/starter/**'
            frontend:
              - *pnpm
              - 'apps/web/**'
              - 'packages/shared/**'
            cli:
              - *pnpm
              - 'apps/cli/**'
              - 'packages/manifest-schema/**'
              - 'packages/starter/**'
            sandbox_agent:
              - '.github/workflows/ci.yml'
              - 'tsconfig.base.json'
              - 'apps/kortix-sandbox-agent-server/**'
              # Bundled into the daemon (KORTIXD_SHARED_SOURCES).
              - 'packages/api-contract/src/**'
              - 'packages/sdk/src/core/session/wire-message-id.ts'
            sandbox_image:
              - '.github/workflows/ci.yml'
              - 'apps/sandbox/Dockerfile'
              - 'scripts/check-sandbox-apt-packages.sh'
            desktop:
              - '.github/workflows/ci.yml'
              - 'apps/desktop-electron/**'
            # self-host stack: anything that can break `kortix self-host start`'s
            # from-scratch DB bootstrap or the CLI's compose generation.
            self_host:
              - *pnpm
              - 'apps/api/Dockerfile'
              - 'apps/kortix-app-runtime/**'
              - 'apps/api/src/snapshots/builder.ts'
              - 'apps/api/src/config.ts'
              - 'packages/db/**'
              - 'apps/cli/src/commands/self-host.ts'
              - 'apps/cli/src/self-host/**'
              - 'apps/cli/scripts/self-host-e2e/**'

  # No API typecheck here: the `packages-api` contract lane runs
  # `pnpm --filter kortix-api typecheck` on the same release tree
  # (tests/bin/package-quality.ts), so a job here was the same tsc twice.

  sandbox-image-packages:
    name: Sandbox image apt packages
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Every apt package the sandbox image installs resolves
        run: bash scripts/check-sandbox-apt-packages.sh

  dependency-scan:
    name: Dependency + secret scan
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  apt-dnat:
    name: Sandbox image apt packages (dnat)
    needs: changes
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Where am I, and each archive address's speed from here
        run: |
          grep -h "Git warm" /var/log/vulcan-git.log 2>/dev/null | tail -1 || true
          ls /var/lib/vulcan/git/done 2>/dev/null && cat /var/lib/vulcan/git/done || echo "no git mirror (spilled VM?)"
          for ip in 91.189.90.11 91.189.90.12 91.189.90.13 91.189.91.81 91.189.91.82 91.189.91.83 91.189.92.22 91.189.92.23 91.189.92.24; do
            curl -s -o /dev/null --max-time 8 --resolve archive.ubuntu.com:80:$ip -w "$ip %{size_download}B %{time_total}s\n" http://archive.ubuntu.com/ubuntu/dists/noble/main/binary-amd64/Packages.xz || true
          done
      - name: apt check forced through a slow address (91.189.91.81)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          sudo nft -f - <<'NFT'
          table ip vx {
            chain pre { type nat hook prerouting priority -101; ip daddr 91.189.88.0/21 tcp dport 80 dnat to 91.189.91.81; }
            chain out { type nat hook output priority -101; ip daddr 91.189.88.0/21 tcp dport 80 dnat to 91.189.91.81; }
          }
          NFT
          time bash scripts/check-sandbox-apt-packages.sh
      - name: apt check forced through a fast address (91.189.92.22)
        run: |
          sudo nft delete table ip vx
          sudo nft -f - <<'NFT'
          table ip vx {
            chain pre { type nat hook prerouting priority -101; ip daddr 91.189.88.0/21 tcp dport 80 dnat to 91.189.92.22; }
            chain out { type nat hook output priority -101; ip daddr 91.189.88.0/21 tcp dport 80 dnat to 91.189.92.22; }
          }
          NFT
          time bash scripts/check-sandbox-apt-packages.sh
